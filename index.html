<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kota Tabungan - Game Ekonomi Anak</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-400 to-blue-600 min-h-screen flex items-center justify-center p-4">
    
    <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-[0_20px_50px_rgba(0,0,0,0.3)] text-center border-4 border-yellow-300 relative overflow-hidden">
        
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-sky-100 rounded-full opacity-50 blur-xl"></div>
        <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-yellow-100 rounded-full opacity-50 blur-xl"></div>

        <div class="relative z-10">
            <div class="w-32 h-32 bg-gradient-to-tr from-yellow-300 to-amber-400 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg border-4 border-white animate-bounce">
                <span class="text-6xl">🚲</span>
            </div>

            <h1 class="text-4xl font-black text-blue-600 tracking-wide mb-3 drop-shadow-sm">
                Kota Tabungan
            </h1>
            
            <p class="text-gray-600 text-base mb-8 leading-relaxed font-medium bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                Misimu adalah mengumpulkan uang jajan untuk membeli <span class="text-blue-600 font-bold">Sepeda Impian seharga Rp 100.000</span> dalam waktu 7 hari! 
                <br><br>
                Bisakah kamu membedakan <span class="text-green-600 font-bold">Kebutuhan</span> & <span class="text-red-500 font-bold">Keinginan</span>?
            </p>

            <a href="game.html" class="inline-block w-full bg-gradient-to-r from-amber-400 to-yellow-400 hover:from-amber-500 hover:to-yellow-500 text-blue-900 font-extrabold text-xl py-4 px-6 rounded-2xl shadow-[0_8px_0_#d97706] hover:shadow-[0_6px_0_#d97706] active:shadow-none transform active:translate-y-[8px] transition-all duration-100 text-center uppercase tracking-wider">
                🎮 Mulai Petualangan!
            </a>
        </div>
    </div>

</body>
</html>

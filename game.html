<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bermain - Kota Tabungan</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen text-gray-800 font-sans">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col justify-between">
        
        <!-- Status Bar Atas -->
        <div class="bg-blue-600 p-4 text-white rounded-b-2xl shadow-md grid grid-cols-2 gap-2 text-center">
            <div class="bg-blue-700 p-2 rounded-xl">
                <span class="text-xs block opacity-80">📅 Hari Ke</span>
                <span id="txt-hari" class="text-xl font-bold">1</span> / 7
            </div>
            <div class="bg-blue-700 p-2 rounded-xl">
                <span class="text-xs block opacity-80">💰 Tabunganmu</span>
                <span id="txt-uang" class="text-xl font-bold text-yellow-300">Rp 0</span>
            </div>
        </div>

        <!-- Area Cerita & Event -->
        <div class="p-6 flex-1 flex flex-col justify-center items-center text-center">
            <div id="game-emoji" class="text-7xl mb-4 animate-bounce">☀️</div>
            <h2 id="game-title" class="text-xl font-bold text-gray-800 mb-2">Hari Baru Dimulai!</h2>
            <p id="game-text" class="text-gray-600 leading-relaxed text-sm bg-gray-50 p-4 rounded-xl border border-gray-100">
                Kamu mendapatkan uang jajan harian sebesar Rp 20.000. Yuk siap-siap berangkat sekolah!
            </p>
        </div>

        <!-- Tombol Pilihan Aksi -->
        <div class="p-4 bg-gray-50 border-t border-gray-100 space-y-3 rounded-t-2xl">
            <button id="btn-opsi1" onclick="pilihOpsi(1)" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 px-4 rounded-xl shadow active:scale-95 transition text-sm">
                Opsi 1
            </button>
            <button id="btn-opsi2" onclick="pilihOpsi(2)" class="w-full bg-red-400 hover:bg-red-500 text-white font-bold py-3.5 px-4 rounded-xl shadow active:scale-95 transition text-sm">
                Opsi 2
            </button>
        </div>

    </div>

    <script>
        // Data State Game
        let hari = 1;
        let uang = 0;
        let targetSepeda = 100000;
        let uangJajanHarian = 20000;

        // Daftar Tantangan / Event Acak harian (Kebutuhan vs Keinginan)
        const daftarEvent = [
            {
                emoji: "🍦",
                title: "Tukang Es Krim Lewat!",
                text: "Teman-temanmu membeli es krim viral seharga Rp 15.000. Cuaca cukup panas, tapi kamu sebenarnya tidak terlalu haus. Apakah kamu ikut membeli?",
                opsi1: "❌ Tidak beli, minum air putih saja (Hemat Rp 0)",
                opsi2: "🍦 Beli es krim biar ikutan eksis (Bayar Rp 15.000)",
                biayaOpsi1: 0, biayaOpsi2: 15000
            },
            {
                emoji: "✏️",
                title: "Pensilmu Patah & Habis",
                text: "Hari ini ada ujian menggambar, pensilmu patah dan tidak bisa dipakai lagi. Kamu harus membeli pensil baru seharga Rp 5.000.",
                opsi1: "✏️ Beli pensil baru untuk ujian (Kebutuhan - Rp 5.000)",
                opsi2: "❌ Tidak beli, nekat pinjam teman (Bisa dihukum guru)",
                biayaOpsi1: 5000, biayaOpsi2: 0,
                catatanOpsi2: "Kamu dihukum karena tidak bawa alat tulis! Tabungamu dikurangi Rp 5.000 buat denda." // efek buruk mengabaikan kebutuhan
            },
            {
                emoji: "🧸",
                title: "Mainan Kapsul (Gacha)",
                text: "Di depan gerbang sekolah ada mesin mainan gacha seharga Rp 10.000. Mainannya terlihat lucu sekali!",
                opsi1: "❌ Lewati saja mesin mainannya (Hemat Rp 0)",
                opsi2: "🪙 Masukkan koin, coba keberuntungan (Bayar Rp 10.000)",
                biayaOpsi1: 0, biayaOpsi2: 10000
            },
            {
                emoji: "🚌",
                title: "Ongkos Pulang Sekolah",
                text: "Langit mendung dan mulai gerimis. Jarak rumah cukup jauh. Apakah kamu mau naik angkutan umum seharga Rp 7.000 atau nekat jalan kaki kehujanan?",
                opsi1: "🚌 Naik angkutan umum demi kesehatan (Kebutuhan - Rp 7.000)",
                opsi2: "🏃‍♂️ Jalan kaki terobos hujan (Hemat Rp 0 - Risiko Sakit)",
                biayaOpsi1: 7000, biayaOpsi2: 0
            },
            {
                emoji: "🍟",
                title: "Jemput Les Kelaparan",
                text: "Sepulang sekolah perutmu keroncongan karena belum makan siang, padahal 30 menit lagi ada les matematika. Ada stan kentang goreng seharga Rp 12.000.",
                opsi1: "🍟 Beli kentang untuk ganjal perut (Kebutuhan - Rp 12.000)",
                opsi2: "❌ Tahan lapar sampai pulang ke rumah (Hemat Rp 0)",
                biayaOpsi1: 12000, biayaOpsi2: 0
            },
            {
                emoji: "🎮",
                title: "Sewa Akun Game Premium",
                text: "Temanmu menawarkan sewa akun game premium selama 1 hari seharga Rp 15.000 agar bisa mabar bareng malam ini.",
                opsi1: "❌ Tolak tawaran, main game gratis saja (Hemat Rp 0)",
                opsi2: "🎮 Ambil! Mau coba karakter premium (Bayar Rp 15.000)",
                biayaOpsi1: 0, biayaOpsi2: 15000
            }
        ];

        let eventSekarang = {};

        function updateTampilan() {
            document.getElementById('txt-hari').innerText = hari;
            document.getElementById('txt-uang').innerText = "Rp " + uang.toLocaleString('id-ID');
        }

        function mulaiHariBaru() {
            if (hari > 7) {
                selesaiGame();
                return;
            }
            
            // Berikan uang jajan harian terlebih dahulu
            uang += uangJajanHarian;
            updateTampilan();

            // Ambil event acak dari daftar tantangan
            eventSekarang = daftarEvent[hari - 1] || daftarEvent[0];

            // Pasang teks ke layar
            document.getElementById('game-emoji').innerText = eventSekarang.emoji;
            document.getElementById('game-title').innerText = `Hari ${hari}: ${eventSekarang.title}`;
            document.getElementById('game-text').innerText = `Kamu dapat uang jajan harian +Rp 20.000.\n\nTantangan Hari Ini:\n${eventSekarang.text}`;
            
            document.getElementById('btn-opsi1').innerText = eventSekarang.opsi1;
            document.getElementById('btn-opsi2').innerText = eventSekarang.opsi2;
        }

        function pilihOpsi(nomorOpsi) {
            let biaya = 0;
            if (nomorOpsi === 1) {
                biaya = eventSekarang.biayaOpsi1;
            } else {
                biaya = eventSekarang.biayaOpsi2;
                // Kasus khusus denda jika mengabaikan kebutuhan dasar (Pensil)
                if(eventSekarang.emoji === "✏️" && nomorOpsi === 2) {
                    biaya = 5000; 
                    alert("Aduh! Kamu dihukum guru karena tidak bawa pensil dan didenda Rp 5.000!");
                }
            }

            uang -= biaya;
            hari++;
            
            updateTampilan();
            mulaiHariBaru();
        }

        function selesaiGame() {
            // Sembunyikan tombol pilihan
            document.getElementById('btn-opsi1').style.display = 'none';
            document.getElementById('btn-opsi2').style.display = 'none';

            document.getElementById('txt-hari').innerText = "Selesai";

            if (uang >= targetSepeda) {
                document.getElementById('game-emoji').innerText = "🎉🏆🚲";
                document.getElementById('game-title').innerText = "Hebat! Kamu Menang!";
                document.getElementById('game-text').innerHTML = `Sisa uang tabunganmu: <b>Rp ${uang.toLocaleString('id-ID')}</b>.<br><br>Kamu berhasil membeli Sepeda Impian! Kamu pintar membedakan Kebutuhan dan Keinginan.`;
            } else {
                document.getElementById('game-emoji').innerText = "😢🚲❌";
                document.getElementById('game-title').innerText = "Wah, Uangmu Belum Cukup";
                document.getElementById('game-text').innerHTML = `Uangmu hanya terkumpul: <b>Rp ${uang.toLocaleString('id-ID')}</b> dari target Rp 100.000.<br><br>Kamu gagal membeli sepeda karena terlalu banyak membeli <b>Keinginan</b> daripada menghemat <b>Kebutuhan</b>. Yuk coba lagi!`;
            }

            // Tambah tombol reset/main lagi
            const wadahTombol = document.querySelector('.p-4');
            wadahTombol.innerHTML = `<button onclick="window.location.reload()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow">🔄 Main Lagi</button>
                                     <a href="index.html" class="block text-center text-sm text-blue-500 font-semibold mt-2">Keluar Menu Utama</a>`;
        }

        // Jalankan game pertama kali saat halaman dimuat
        mulaiHariBaru();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bermain - Kota Tabungan</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; }
        /* Tombol Fisik 3D */
        .tombol-hijau-3d {
            box-shadow: 0 6px 0 #047857;
            transition: all 0.05s ease;
        }
        .tombol-hijau-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #047857;
        }
        .tombol-merah-3d {
            box-shadow: 0 6px 0 #be123c;
            transition: all 0.05s ease;
        }
        .tombol-merah-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #be123c;
        }
        /* Frame Layar HP */
        .frame-mobile-3d {
            box-shadow: 0 16px 0 #1e3a8a, 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-400 via-sky-300 to-blue-500 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-sm bg-white rounded-[2.5rem] p-5 border-4 border-blue-900 frame-mobile-3d flex flex-col justify-between relative overflow-hidden min-h-[580px]">
        
        <div class="grid grid-cols-2 gap-3 text-center mb-4">
            <div class="bg-gradient-to-b from-blue-500 to-blue-600 border-2 border-blue-900 p-2 rounded-2xl text-white shadow-sm">
                <span class="text-[10px] block font-black uppercase tracking-wider opacity-80">📅 HARI</span>
                <span id="txt-hari" class="text-xl font-black text-yellow-300 drop-shadow">1</span> <span class="text-xs font-bold">/ 7</span>
            </div>
            <div class="bg-gradient-to-b from-blue-500 to-blue-600 border-2 border-blue-900 p-2 rounded-2xl text-white shadow-sm">
                <span class="text-[10px] block font-black uppercase tracking-wider opacity-80">💰 TABUNGAN</span>
                <span id="txt-uang" class="text-xl font-black text-emerald-300 drop-shadow">Rp 0</span>
            </div>
        </div>

        <div class="flex-1 flex flex-col justify-center items-center my-2">
            <div class="w-24 h-24 bg-amber-50 rounded-full flex items-center justify-center shadow-inner border-4 border-blue-900 mb-3 animate-bounce">
                <div id="game-emoji" class="text-5xl">☀️</div>
            </div>
            
            <h2 id="game-title" class="text-xl font-black text-blue-700 tracking-wide mb-2 text-center">
                Memuat Tantangan...
            </h2>
            
            <div id="game-box" class="w-full text-gray-700 font-semibold text-sm bg-gradient-to-br from-gray-50 to-blue-50/40 p-4 rounded-2xl border-2 border-blue-100 shadow-sm whitespace-pre-line text-center min-h-[120px] flex items-center justify-center">
                </div>
        </div>

        <div id="action-box" class="space-y-4 mt-4 pt-3 border-t-2 border-dashed border-gray-100">
            <button id="btn-opsi1" onclick="pilihOpsi(1)" class="tombol-hijau-3d w-full bg-gradient-to-r from-emerald-400 to-green-500 text-white font-black py-3.5 px-4 rounded-xl border-2 border-blue-900 text-xs tracking-wide text-left flex items-center justify-between">
                <span>Opsi 1</span>
                <span>➡️</span>
            </button>
            <button id="btn-opsi2" onclick="pilihOpsi(2)" class="tombol-merah-3d w-full bg-gradient-to-r from-rose-400 to-red-500 text-white font-black py-3.5 px-4 rounded-xl border-2 border-blue-900 text-xs tracking-wide text-left flex items-center justify-between">
                <span>Opsi 2</span>
                <span>➡️</span>
            </button>
        </div>

    </div>

    <script>
        // Data Tantangan Harian Anak
        const daftarEvent = [
            {
                emoji: "🍌", // Bonus Pisang / Banana Snack sehat!
                title: "Camilan Sehat Sore Hari",
                text: "Perutmu lapar sore ini. Ada tukang buah menjual Pisang Goreng Madu seharga Rp 10.000, tapi Ibu di rumah sudah menyediakan pisang rebus gratis.",
                opsi1: "❌ Tahan lapar, makan pisang rebus di rumah (Hemat Rp 0)",
                opsi2: "🍌 Beli pisang goreng madu di luar (Bayar Rp 10.000)",
                biayaOpsi1: 0, biayaOpsi2: 10000
            },
            {
                emoji: "🍦", 
                title: "Tukang Es Krim Lewat!",
                text: "Teman-temanmu membeli es krim viral seharga Rp 15.000. Cuaca cukup panas, tapi kamu sebenarnya tidak terlalu haus. Apakah kamu ikut membeli?",
                opsi1: "❌ Tidak beli, minum air putih saja (Hemat Rp 0)",
                opsi2: "🍦 Beli es krim biar ikutan eksis (Bayar Rp 15.000)",
                biayaOpsi1: 0, biayaOpsi2: 15000
            },
            {
                emoji: "✏️", 
                title: "Pensilmu Patah & Habis",
                text: "Hari ini ada ujian menggambar, pensilmu patah dan habis. Kamu harus membeli pensil baru seharga Rp 5.000 di koperasi sekolah.",
                opsi1: "✏️ Beli pensil baru untuk ujian (Kebutuhan - Rp 5.000)",
                opsi2: "❌ Tidak beli, nekat ujian tanpa alat tulis",
                biayaOpsi1: 5000, biayaOpsi2: 0,
                catatanOpsi2: "Kamu dihukum guru karena tidak bawa pensil! Kamu dipaksa bayar denda koperasi Rp 5.000."
            },
            {
                emoji: "🧸", 
                title: "Mainan Kapsul Gacha",
                text: "Di depan gerbang sekolah ada mesin mainan gacha seharga Rp 10.000. Mainannya terlihat sangat lucu dan semua temanmu membelinya.",
                opsi1: "❌ Lewati saja mesin mainannya (Hemat Rp 0)",
                opsi2: "🪙 Masukkan koin, coba keberuntungan (Bayar Rp 10.000)",
                biayaOpsi1: 0, biayaOpsi2: 10000
            },
            {
                emoji: "🚌", 
                title: "Ongkos Pulang Sekolah",
                text: "Langit tiba-tiba mendung tebal dan gerimis. Jarak rumah cukup jauh. Apakah kamu mau naik angkutan seharga Rp 7.000 atau nekat jalan kaki?",
                opsi1: "🚌 Naik angkutan demi kesehatan (Kebutuhan - Rp 7.000)",
                opsi2: "🏃‍♂️ Jalan kaki terobos hujan (Hemat Rp 0)",
                biayaOpsi1: 7000, biayaOpsi2: 0
            },
            {
                emoji: "🎮", 
                title: "Sewa Game Premium",
                text: "Temanmu menawarkan sewa akun game online premium selama 1 hari seharga Rp 15.000 agar bisa main bareng malam ini.",
                opsi1: "❌ Tolak tawaran, main game gratis saja (Hemat Rp 0)",
                opsi2: "🎮 Ambil! Mau coba karakter baru (Bayar Rp 15.000)",
                biayaOpsi1: 0, biayaOpsi2: 15000
            },
            {
                emoji: "🏁", 
                title: "Hari Penentuan!",
                text: "Waktu 7 hari sudah selesai! Mari kita hitung seluruh keputusan finansialmu selama seminggu ini.",
                opsi1: "Buka Celengan Tabungan Akhir! 🔍",
                opsi2: "Buka Celengan Tabungan Akhir! 🔍",
                biayaOpsi1: 0, biayaOpsi2: 0
            }
        ];

        let hari = 1;
        let uang = 0;
        const targetSepeda = 100000;
        const uangJajanHarian = 20000;
        let eventSekarang = {};

        function updateTampilan() {
            document.getElementById('txt-hari').innerText = hari > 7 ? "Selesai" : hari;
            document.getElementById('txt-uang').innerText = "Rp " + uang.toLocaleString('id-ID');
        }

        function mulaiHariBaru() {
            if (hari > 7) {
                selesaiGame();
                return;
            }
            
            uang += uangJajanHarian;
            updateTampilan();

            eventSekarang = daftarEvent[hari - 1];

            document.getElementById('game-emoji').innerText = eventSekarang.emoji;
            document.getElementById('game-title').innerText = `Hari ${hari}: ${eventSekarang.title}`;
            document.getElementById('game-box').innerText = `Uang Saku Hari Ini: +Rp 20.000\n\n${eventSekarang.text}`;
            
            document.getElementById('btn-opsi1').innerHTML = `<span>${eventSekarang.opsi1}</span> <span>➡️</span>`;
            document.getElementById('btn-opsi2').innerHTML = `<span>${eventSekarang.opsi2}</span> <span>➡️</span>`;
        }

        function pilihOpsi(nomorOpsi) {
            let biaya = 0;
            if (nomorOpsi === 1) {
                biaya = eventSekarang.biayaOpsi1;
            } else {
                biaya = eventSekarang.biayaOpsi2;
                if(eventSekarang.emoji === "✏️" && nomorOpsi === 2) {
                    biaya = 5000; 
                    alert(eventSekarang.catatanOpsi2);
                }
            }

            uang -= biaya;
            hari++;
            
            updateTampilan();
            mulaiHariBaru();
        }

        function selesaiGame() {
            document.getElementById('txt-hari').innerText = "Selesai";
            const wadahTombol = document.getElementById('action-box');

            if (uang >= targetSepeda) {
                document.getElementById('game-emoji').innerText = "🎉🏆🚲";
                document.getElementById('game-title').innerText = "Selamat! Kamu Menang!";
                document.getElementById('game-box').innerHTML = `Tabungan Akhir: <b class="text-green-600">Rp ${uang.toLocaleString('id-ID')}</b>.<br><br>Kamu Berhasil membeli Sepeda Baru! Kamu pintar mengelola keuangan!`;
            } else {
                document.getElementById('game-emoji').innerText = "😢🚲❌";
                document.getElementById('game-title').innerText = "Yah, Belum Cukup";
                document.getElementById('game-box').innerHTML = `Tabungan Akhir: <b class="text-red-500">Rp ${uang.toLocaleString('id-ID')}</b> dari target Rp 100.000.<br><br>Kamu gagal mendapatkan sepeda karena terlalu boros membeli keinginan.`;
            }

            wadahTombol.innerHTML = `
                <button onclick="window.location.reload()" class="tombol-hijau-3d w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-black py-4 rounded-xl border-2 border-blue-900 uppercase tracking-wider text-center text-sm">🔄 Coba Main Lagi</button>
                <a href="index.html" class="block text-center text-xs text-blue-600 font-bold hover:underline mt-2">Keluar Ke Menu Belakang</a>
            `;
        }

        window.onload = mulaiHariBaru;
    </script>
</body>
</html>

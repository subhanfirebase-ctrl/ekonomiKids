<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bermain - Kota Tabungan</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-50 to-sky-100 min-h-screen text-gray-800">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col justify-between border-x-4 border-blue-200">
        
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-4 text-white rounded-b-3xl shadow-lg grid grid-cols-2 gap-3 text-center">
            <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/20 shadow-inner">
                <span class="text-xs block font-semibold uppercase tracking-wider opacity-70">📅 Hari Ke</span>
                <span id="txt-hari" class="text-2xl font-black text-yellow-300 drop-shadow">1</span> <span class="text-sm font-medium opacity-80">/ 7</span>
            </div>
            <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/20 shadow-inner">
                <span class="text-xs block font-semibold uppercase tracking-wider opacity-70">💰 Tabunganmu</span>
                <span id="txt-uang" class="text-2xl font-black text-emerald-300 drop-shadow">Rp 0</span>
            </div>
        </div>

        <div class="p-6 flex-1 flex flex-col justify-center items-center text-center my-4">
            <div class="w-24 h-24 bg-amber-50 rounded-full flex items-center justify-center shadow-md border-2 border-amber-200 mb-4 animate-bounce">
                <div id="game-emoji" class="text-5xl">☀️</div>
            </div>
            
            <h2 id="game-title" class="text-2xl font-bold text-blue-700 mb-3 tracking-wide">
                Hari Baru Dimulai!
            </h2>
            
            <div id="game-box" class="w-full text-gray-700 leading-relaxed font-medium text-base bg-gradient-to-br from-gray-50 to-blue-50/30 p-5 rounded-2xl border-2 border-blue-100 shadow-sm whitespace-pre-line text-center">
                </div>
        </div>

        <div id="action-box" class="p-4 bg-gray-50 border-t-2 border-gray-100 space-y-4 rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
            <button id="btn-opsi1" onclick="pilihOpsi(1)" class="w-full bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 text-white font-bold py-4 px-4 rounded-2xl shadow-[0_5px_0_#047857] active:shadow-none transform active:translate-y-[5px] transition-all duration-700 text-sm tracking-wide">
                Opsi 1
            </button>
            <button id="btn-opsi2" onclick="pilihOpsi(2)" class="w-full bg-gradient-to-r from-rose-400 to-red-500 hover:from-rose-500 hover:to-red-600 text-white font-bold py-4 px-4 rounded-2xl shadow-[0_5px_0_#be123c] active:shadow-none transform active:translate-y-[5px] transition-all duration-700 text-sm tracking-wide">
                Opsi 2
            </button>
        </div>

    </div>

    <script src="src/js/data.js"></script>
    <script src="src/js/engine.js"></script>
</body>
</html>
